# Builds both halves of SkyCraft and packs the release files (the same as tools\package.ps1 on a PC).
# The files end up under "Artifacts" on the run's page.
name: build

on:
  push:
    branches-ignore:
      - 'build-output/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg .tools\vcpkg
          .tools\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Skyrim plugin
        shell: pwsh
        working-directory: skse
        run: |
          cmake --preset default
          if ($LASTEXITCODE) { throw "configure failed" }
          cmake --build --preset release
          if ($LASTEXITCODE) { throw "the SKSE plugin didn't build" }

      - name: Minecraft mod
        shell: pwsh
        working-directory: fabric
        run: |
          .\gradlew.bat build --no-configuration-cache
          if ($LASTEXITCODE) { throw "the Fabric mod didn't build" }

      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\package.ps1 -NoBuild

      - uses: actions/upload-artifact@v4
        with:
          name: SkyCraft
          path: dist/*
          if-no-files-found: error

      # The built files (and the plugin with its debug symbols, for reading crash logs) also go to a
      # branch of their own, build-output/<branch>, replaced by each build.
      - name: Publish build output
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item dist\* $out
          Copy-Item skse\build\RelWithDebInfo\SkyCraft.dll $out
          Get-ChildItem $out | Where-Object { $_.Length -gt 95MB } | Remove-Item
          Get-ChildItem $out | ForEach-Object { "{0,-40} {1,12:N0} bytes" -f $_.Name, $_.Length }
          Set-Location $out
          git init -q
          git add -A
          git -c user.name="SkyCraft build" -c user.email="build@users.noreply.github.com" commit -q -m "Build of $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" "HEAD:refs/heads/build-output/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE) { throw "couldn't publish the build output" }
